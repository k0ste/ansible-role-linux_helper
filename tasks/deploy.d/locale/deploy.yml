---
- name: "linux_helper | Deploy locales"
  community.general.locale_gen:
    name: "{{ _linux_helper_locale_gen_locales['locale'] + '.' +
      _linux_helper_locale_gen_locales['charset'] }}"
    state: "present"
  loop: "{{ lookup('ansible.builtin.vars', '_linux_helper_locale_settings') |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "_linux_helper_locale_gen_locales"
    label: "{{ 'Deploy locale: ' +
      _linux_helper_locale_gen_locales['locale'] }}"
  when:
    - "hostvars[inventory_hostname]['ansible_facts']['os_family'] in ('Debian',
      'Archlinux')"
- name: "linux_helper | Deploy locale.conf"
  ansible.builtin.template:
    src: "locale_conf.j2"
    dest: "/etc/locale.conf"
    owner: "root"
    group: "root"
    mode: "0644"
    force: "yes"
  when:
    - "lookup('ansible.builtin.vars', 'linux_helper', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'linux_helper') |
       community.general.json_query(lookup('ansible.builtin.vars',
       '_linux_helper_set_langs', default='')) == 'true'"
  vars:
    _linux_helper_set_langs: "[].locale[] | map(&set_langs || 'false', @) | [0]"
