---
- name: "linux_helper | Install the locale packages for RedHat"
  when:
    - "hostvars[inventory_hostname]['ansible_facts']['os_family'] == 'RedHat'"
  block:
    - name: "linux_helper | Update dnf cache"
      ansible.builtin.dnf:
        update_cache: "yes"
    - name: "linux_helper | Install langpack packages"
      ansible.builtin.dnf:
        name: "{{ _linux_helper_locale_langpacks }}"
        state: "present"
      vars:
        _linux_helper_locale_langpacks: "{{ lookup('ansible.builtin.vars',
          '_linux_helper_locale_langs', default=[]) |
          map('regex_replace', '^(.*)$', 'langpacks-\\1') | list() }}"
      when:
        - "_linux_helper_locale_langpacks not in ['', [], '[]', None]"
