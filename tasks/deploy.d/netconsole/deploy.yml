---
- name: "linux_helper | Create netconsole override systemd service directory"
  ansible.builtin.file:
    path: "{{ lookup('ansible.builtin.vars',
      'linux_helper_netconsole_systemd_dir') }}"
    state: "directory"
    group: "root"
    owner: "root"
    mode: "0755"
    recurse: "no"
# This task restart netconsole service on failure, such as error in MAC
# resolution on physdev setup (via NetworkManager-dispatcher, for example)
- name: "linux_helper | Deploy netconsole service configuration"
  ansible.builtin.template:
    src: "netconsole_service.j2"
    dest: "{{ lookup('ansible.builtin.vars',
      'linux_helper_netconsole_systemd_dir') + '/netconsole.conf' }}"
    owner: "root"
    group: "root"
    mode: "0644"
  notify:
    - "Daemon reload"
    - "Restart netconsole"
- name: "linux_helper | Deploy netconsole configuration"
  when:
    - "lookup('ansible.builtin.vars', 'linux_helper_netconsole_settings',
      default='') not in ['', [], '[]', None]"
  block:
    - name: "linux_helper | Deploy netconsole configuration (not Debian)"
      ansible.builtin.template:
        src: "netconsole.j2"
        dest: "{{ lookup('ansible.builtin.vars',
          'linux_helper_netconsole_dest') + '/netconsole' }}"
        owner: "root"
        group: "root"
        mode: "0644"
        force: "yes"
      notify:
        - "Restart netconsole"
      when:
        - "hostvars[inventory_hostname]['ansible_facts']['os_family'] !=
          'Debian'"
    - name: "linux_helper | Deploy netconsole configuration (Debian)"
      ansible.builtin.template:
        src: "netconsole_Debian.j2"
        dest: "{{ lookup('ansible.builtin.vars',
          'linux_helper_netconsole_dest') + '/netconsole' }}"
        owner: "root"
        group: "root"
        mode: "0644"
        force: "yes"
      notify:
        - "Restart netconsole"
      when:
        - "hostvars[inventory_hostname]['ansible_facts']['os_family'] ==
          'Debian'"
- name: "linux_helper | Enable netconsole service"
  ansible.builtin.systemd:
    name: "netconsole"
    enabled: "yes"
